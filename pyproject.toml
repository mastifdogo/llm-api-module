[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txcat"
version = "0.1.0"
description = "LLM-assisted transaction categorization for bookkeeping statements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only needed for the Claude backend; the Ollama backend uses the stdlib.
anthropic = ["anthropic>=0.75"]
dev = ["pytest"]

[project.scripts]
txcat = "txcat.cli:main"

[tool.setuptools]
packages = ["txcat"]
